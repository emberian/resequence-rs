[package]
name = "resequence-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Ember Arlynx"]
description = "WASM bindings for the resequence time-travel simulation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Reference the main resequence crate
resequence = { path = "../.." }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
lto = true
opt-level = "s"
